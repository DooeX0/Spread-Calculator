<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Калькулятор Спреда</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #e0e0e0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }

        .container {
            background: #1e1e1e;
            width: 100%;
            max-width: 400px;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        label {
            font-size: 16px;
            margin-top: 10px;
        }

        select, input, button {
            width: 100%;
            max-width: 360px;
            padding: 12px 15px;
            margin: 5px 0;
            border-radius: 10px;
            border: 1px solid #333;
            font-size: 16px;
            box-sizing: border-box;
            text-align: center;
        }

        input, select {
            background-color: #2e2e2e;
            color: #e0e0e0;
        }

        input::placeholder {
            color: #888;
            text-align: center;
        }

        button {
            background-color: #3498db;
            color: white;
            cursor: pointer;
        }

        button:hover {
            background-color: #2980b9;
        }

        .result {
            font-size: 20px;
            margin-top: 10px;
        }

        .history {
            margin-top: 20px;
            background: #1e1e1e;
            padding: 10px;
            border-radius: 5px;
            width: 100%;
            max-width: 360px;
            max-height: 200px;
            overflow-y: auto;
            text-align: left;
        }

        .history h3 {
            text-align: center;
            border-bottom: 2px solid #3498db;
            padding-bottom: 5px;
            margin-bottom: 10px;
        }

        ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        li {
            padding: 10px;
            border-radius: 5px;
            background: #2e2e2e;
            margin-bottom: 5px;
            border-left: 4px solid #3498db;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Калькулятор Спреда</h2>
        <label>Выберите монету:</label>
        <select id="coinSelect">
            <option value="TONUSDT">TON</option>
            <option value="NOTUSDT">NOT</option>
            <option value="HMSTRUSDT">HMSTR</option>
            <option value="DOGSUSDT">DOGS</option>
        </select>
        <p>Рыночная цена: <span id="marketPrice">0.0000000</span></p>
        <input type="number" id="dollarRate" placeholder="Курс доллара">
        <input type="number" id="sellPrice" placeholder="Цена продажи">
        <button onclick="calculateSpread()">Рассчитать</button>
        <p class="result" id="spreadResult">Спред: -</p>
        <div class="history">
            <h3>История спреда</h3>
            <ul id="historyList"></ul>
        </div>
        <button onclick="clearHistory()">Очистить историю</button>
    </div>

    <script>
        let socket;
        function connectWebSocket(coin) {
            if (socket) socket.close();
            socket = new WebSocket("wss://stream.bybit.com/v5/public/spot");
            socket.onopen = () => {
                socket.send(JSON.stringify({ op: "subscribe", args: ["tickers." + coin] }));
            };
            socket.onmessage = (event) => {
                let data = JSON.parse(event.data);
                if (data.data && data.data.lastPrice) {
                    document.getElementById("marketPrice").innerText = parseFloat(data.data.lastPrice).toFixed(7);
                }
            };
        }

        document.getElementById("coinSelect").addEventListener("change", function() {
            connectWebSocket(this.value);
            document.getElementById("marketPrice").innerText = "0.0000000";
        });

        function calculateSpread() {
            let marketPrice = parseFloat(document.getElementById("marketPrice").innerText);
            let dollarRate = parseFloat(document.getElementById("dollarRate").value);
            let sellPrice = parseFloat(document.getElementById("sellPrice").value);
            let coin = document.getElementById("coinSelect").value;

            if (!marketPrice || !dollarRate || !sellPrice) {
                document.getElementById("spreadResult").innerText = "Ошибка: введите корректные значения";
                return;
            }

            let finalPrice = marketPrice * dollarRate;
            let spread = ((sellPrice - 0.009 * sellPrice - finalPrice) / finalPrice) * 100;
            document.getElementById("spreadResult").innerText = `Спред: ${spread.toFixed(2)}%`;

            let historyList = document.getElementById("historyList");
            let listItem = document.createElement("li");
            listItem.innerHTML = `<strong>${coin}</strong>: Спред: ${spread.toFixed(2)}% (Покупка: ${finalPrice.toFixed(7)}, Продажа: ${sellPrice})`;
            historyList.prepend(listItem);
        }

        function clearHistory() {
            document.getElementById("historyList").innerHTML = "";
        }

        connectWebSocket("TONUSDT");
    </script>
</body>
</html>
