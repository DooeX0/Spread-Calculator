<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Калькулятор Спреда</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        background-color: #121212;
        color: #e0e0e0;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
        text-align: center;
      }

      .container {
        background: #1e1e1e;
        width: 100%;
        max-width: 400px;
        padding: 25px;
        border-radius: 15px;
        box-shadow: 0 0 15px rgba(0, 0, 0, 0.5);
        text-align: center;
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      h2 {
        font-size: 24px;
        margin-bottom: 20px;
        color: #3498db;
      }

      label {
        font-size: 16px;
        margin-top: 15px;
        margin-bottom: 5px;
        display: block;
        color: #e0e0e0;
      }

      select,
      input,
      button {
        width: calc(100% - 30px);
        max-width: 360px;
        padding: 12px 15px;
        margin: 10px 0;
        border-radius: 10px;
        font-size: 16px;
        box-sizing: border-box;
        text-align: center;
        background-color: #2e2e2e;
        color: #e0e0e0;
        border: none;
        outline: none;
      }

      /* Подсветка только для полей "Курс доллара" и "Введите цену продажи" */
      #dollarRate:focus,
      #sellPrice:focus {
        box-shadow: 0 0 5px rgba(52, 152, 219, 0.5);
      }

      input::placeholder {
        color: #888;
        text-align: center;
      }

      button {
        background-color: #3498db;
        color: white;
        cursor: pointer;
        font-weight: bold;
        transition: background-color 0.3s ease;
      }

      button:hover {
        background-color: #2980b9;
      }

      .result {
        font-size: 20px;
        margin-top: 20px;
        font-weight: bold;
      }

      .history {
        margin-top: 20px;
        padding: 15px;
        border-radius: 10px;
        width: calc(100% - 30px);
        max-width: 360px;
        max-height: 200px;
        overflow-y: auto;
        text-align: left;
      }

      .history h3 {
        text-align: center;
        margin-bottom: 15px;
        font-size: 18px;
        color: #3498db;
        background: none;
        border: none;
        outline: none;
        box-shadow: none;
        padding: 0;
        margin-top: 0;
      }

      .history ul {
        list-style: none;
        padding: 10px;
        margin: 0;
        border-radius: 5px;
      }

      .history li {
        padding: 10px;
        border-radius: 5px;
        background: #1e1e1e;
        margin-bottom: 10px;
        border-left: 4px solid #3498db;
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 14px;
      }

      .delete-btn {
        background-color: #e74c3c;
        color: white;
        border: none;
        border-radius: 5px;
        padding: 5px 10px;
        cursor: pointer;
        font-size: 12px;
        transition: background-color 0.3s ease;
      }

      .delete-btn:hover {
        background-color: #c0392b;
      }

      .dollarRateField {
        display: block;
        width: 100%;
        max-width: 360px;
      }

      .dollarRateField input {
        width: 100%;
        max-width: 360px;
        padding: 12px 15px;
        margin: 10px 0;
        border-radius: 10px;
        font-size: 16px;
        box-sizing: border-box;
        text-align: center;
        background-color: #2e2e2e;
        color: #e0e0e0;
        border: none;
        outline: none;
      }

      .dollarRateText {
        display: none;
        font-size: 18px;
        color: #3498db;
        margin-top: 10px;
        font-weight: bold;
      }

      .info-text {
        font-size: 14px;
        color: #888;
        margin-top: 5px;
      }

      .side-menu {
        position: fixed;
        top: 0;
        right: -360px;
        width: 360px;
        height: 100%;
        background: #1e1e1e;
        box-shadow: -2px 0 10px rgba(0, 0, 0, 0.5);
        transition: right 0.3s ease, visibility 0.3s ease, opacity 0.3s ease;
        padding: 20px;
        z-index: 999;
        visibility: hidden;
        opacity: 0;
        overflow-y: auto;
      }

      .side-menu.open {
        right: 0;
        visibility: visible;
        opacity: 1;
      }

      .side-menu h3 {
        color: #3498db;
        text-align: center;
        margin-bottom: 20px;
        margin-top: 50px;
      }

      .bank-list {
        display: flex;
        flex-direction: column;
        gap: 15px;
      }

      .bank-item {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      .bank-item label {
        font-size: 14px;
        color: #3498db;
        font-weight: bold;
      }

      .bank-item input {
        width: 100%;
        padding: 8px 12px;
        border-radius: 8px;
        font-size: 14px;
        background-color: #2e2e2e;
        color: #e0e0e0;
        border: none;
        outline: none;
      }

      .clear-all-btn {
        background-color: #e74c3c;
        color: white;
        border: none;
        border-radius: 10px;
        padding: 12px 15px;
        font-size: 16px;
        cursor: pointer;
        margin-top: 20px;
        margin-bottom: 30px;
        width: 100%;
        transition: background-color 0.3s ease;
      }

      .clear-all-btn:hover {
        background-color: #c0392b;
      }

      .burger-menu {
        position: fixed; /* Закрепляем кнопку на экране */
        top: 20px; /* Отступ сверху */
        right: 20px; /* Отступ справа */
        cursor: pointer;
        display: flex;
        flex-direction: column;
        gap: 5px;
        z-index: 1000; /* Убедимся, что кнопка всегда поверх других элементов */
        background: #1e1e1e; /* Фон кнопки */
        padding: 10px;
        border-radius: 10px;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.5); /* Тень кнопки */
        transition: background-color 0.3s ease, box-shadow 0.3s ease; /* Плавное изменение фона и тени */
      }

      /* Стили для кнопки бургера, когда боковое меню открыто */
      .side-menu.open ~ .burger-menu {
        background: transparent; /* Убираем фон */
        box-shadow: none; /* Убираем тень */
      }

      .burger-menu span {
        width: 25px;
        height: 3px;
        background-color: #3498db;
        transition: all 0.3s ease;
      }

      .burger-menu:hover span {
        background-color: #2980b9;
      }

      @media (max-width: 480px) {
        .container {
          padding: 15px;
          border-radius: 10px;
        }

        h2 {
          font-size: 20px;
        }

        label {
          font-size: 14px;
        }

        select,
        input,
        button {
          padding: 10px 12px;
          font-size: 14px;
        }

        .result {
          font-size: 18px;
        }

        .history {
          padding: 10px;
          max-height: 150px;
        }

        .history h3 {
          font-size: 16px;
        }

        li {
          font-size: 12px;
          padding: 8px;
        }

        .delete-btn {
          padding: 4px 8px;
          font-size: 10px;
        }

        .dollarRateText {
          font-size: 16px;
        }

        .side-menu {
          width: 100%;
          right: -100%;
        }

        .side-menu.open {
          right: 0;
        }
      }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  </head>
  <body>
    <div class="burger-menu" onclick="toggleSideMenu()">
      <span></span>
      <span></span>
      <span></span>
    </div>

    <div class="side-menu" id="sideMenu">
      <h3>ПЕРЕВОДЫ</h3>
      <div class="bank-list" id="bankList">
        <!-- Список банков будет заполнен динамически -->
      </div>
      <button class="clear-all-btn" onclick="clearAllTransfers()">
        Очистить все переводы
      </button>
    </div>

    <div class="container">
      <h2>Калькулятор Спреда</h2>
      <label>Выберите монету:</label>
      <select id="coinSelect">
        <option value="TONUSDT">TON</option>
        <option value="NOTUSDT">NOT</option>
        <option value="HMSTRUSDT">HMSTR</option>
        <option value="DOGSUSDT">DOGS</option>
      </select>

      <p>Рыночная цена: <span id="marketPrice">0.0000000</span></p>

      <label>Выберите способ получения курса доллара:</label>
      <select id="rateMethod">
        <option value="manual">Ручной ввод</option>
        <option value="auto">Автоматически (USDT + 1 рубль)</option>
      </select>

      <div class="dollarRateField">
        <input type="number" id="dollarRate" placeholder="Курс доллара" />
      </div>
      <div class="dollarRateText" id="dollarRateText">
        Курс доллара: <span id="autoDollarRate">-</span>
      </div>

      <label>Цена продажи:</label>
      <input type="number" id="sellPrice" placeholder="Введите цену продажи" />

      <button onclick="calculateSpread()">Рассчитать</button>
      <p class="result" id="spreadResult">Спред:</p>

      <div class="history">
        <h3>История спреда</h3>
        <ul id="historyList"></ul>
      </div>

      <button onclick="clearHistory()">Очистить историю</button>
    </div>

    <script>
      const banks = [
        "Т БАНК",
        "ВБ",
        "АЛЬФА",
        "СБЕР",
        "ГАЗПРОМ",
        "ВТБ",
        "ЯНДЕКС",
        "ОЗОН",
        "МТС",
        "ОТП БАНК",
        "РСХБ",
        "ПСБ",
        "ПОЧТА БАНК",
        "БАЙБИТ",
        "ТЕЛЕГРАММ",
        "ЮМАНИ",
      ];

      let transfersData = {};

      // Загрузка данных из localStorage
      function loadTransfersData() {
        const savedData = localStorage.getItem("transfersData");
        if (savedData) {
          transfersData = JSON.parse(savedData);
        } else {
          banks.forEach((bank) => {
            transfersData[bank] = { incoming: "", outgoing: "" };
          });
        }
      }

      // Сохранение данных в localStorage
      function saveTransfersData() {
        localStorage.setItem("transfersData", JSON.stringify(transfersData));
      }

      // Очистка всех переводов
      function clearAllTransfers() {
        banks.forEach((bank) => {
          transfersData[bank] = { incoming: "", outgoing: "" };
        });
        saveTransfersData();
        renderBankList();
      }

      // Рендеринг списка банков
      function renderBankList() {
        const bankList = document.getElementById("bankList");
        bankList.innerHTML = banks
          .map(
            (bank) => `
          <div class="bank-item">
            <label>${bank}</label>
            <input
              type="number"
              placeholder="Входящий перевод"
              value="${transfersData[bank].incoming}"
              oninput="updateTransfer('${bank}', 'incoming', this.value)"
            />
            <input
              type="number"
              placeholder="Исходящий перевод"
              value="${transfersData[bank].outgoing}"
              oninput="updateTransfer('${bank}', 'outgoing', this.value)"
            />
          </div>
        `
          )
          .join("");
      }

      // Обновление данных о переводах
      function updateTransfer(bank, type, value) {
        transfersData[bank][type] = value;
        saveTransfersData();
      }

      // Инициализация
      function init() {
        loadTransfersData();
        renderBankList();
      }

      // Остальной код калькулятора спреда
      let socket,
        usdtPrice = 0;
      let spreadHistory = {};
      let calculationId = 0;

      ["TONUSDT", "NOTUSDT", "HMSTRUSDT", "DOGSUSDT"].forEach((coin) => {
        spreadHistory[coin] = [];
      });

      async function fetchUSDTPrice() {
        try {
          let response = await fetch(
            "https://api.coingecko.com/api/v3/simple/price?ids=tether&vs_currencies=rub"
          );
          let data = await response.json();
          usdtPrice = data.tether.rub;
          document.getElementById("autoDollarRate").innerText = (
            usdtPrice + 1
          ).toFixed(2);
        } catch (error) {
          console.error("Ошибка при получении курса USDT:", error);
        }
      }

      function connectWebSocket(coin) {
        if (socket) socket.close();
        socket = new WebSocket("wss://stream.bybit.com/v5/public/spot");
        socket.onopen = () => {
          socket.send(
            JSON.stringify({ op: "subscribe", args: ["tickers." + coin] })
          );
        };
        socket.onmessage = (event) => {
          let data = JSON.parse(event.data);
          if (data.data && data.data.lastPrice) {
            document.getElementById("marketPrice").innerText = parseFloat(
              data.data.lastPrice
            ).toFixed(7);
          }
        };
      }

      document
        .getElementById("coinSelect")
        .addEventListener("change", function () {
          connectWebSocket(this.value);
          document.getElementById("marketPrice").innerText = "0.0000000";
        });

      document
        .getElementById("rateMethod")
        .addEventListener("change", function () {
          if (this.value === "manual") {
            document.querySelector(".dollarRateField").style.display = "block";
            document.querySelector(".dollarRateText").style.display = "none";
          } else {
            document.querySelector(".dollarRateField").style.display = "none";
            document.querySelector(".dollarRateText").style.display = "block";
          }
        });

      async function calculateSpread() {
        let marketPrice = parseFloat(
          document.getElementById("marketPrice").innerText
        );
        let sellPrice = parseFloat(document.getElementById("sellPrice").value);
        let coin = document.getElementById("coinSelect").value;
        let rateMethod = document.getElementById("rateMethod").value;

        let dollarRate;

        if (rateMethod === "manual") {
          dollarRate = parseFloat(document.getElementById("dollarRate").value);
        } else if (rateMethod === "auto") {
          if (usdtPrice === 0) {
            await fetchUSDTPrice();
          }
          dollarRate = usdtPrice + 1;
        }

        if (!marketPrice || !dollarRate || !sellPrice) {
          document.getElementById("spreadResult").innerText = "Спред:";
          return;
        }

        let finalPrice = marketPrice * dollarRate;
        let spread =
          ((sellPrice - 0.009 * sellPrice - finalPrice) / finalPrice) * 100;
        const spreadResult = document.getElementById("spreadResult");

        if (spread < 0) {
          spreadResult.style.color = "#e74c3c";
        } else {
          spreadResult.style.color = "#2ecc71";
        }

        spreadResult.innerText = `Спред: ${spread.toFixed(2)}%`;

        let historyList = document.getElementById("historyList");
        let listItem = document.createElement("li");
        calculationId++;
        listItem.setAttribute("data-id", calculationId);
        listItem.innerHTML = `
          <div>
            <strong>${coin}</strong>: Спред: ${spread.toFixed(
          2
        )}% (Покупка: ${finalPrice.toFixed(7)}, Продажа: ${sellPrice})
          </div>
          <button class="delete-btn" onclick="deleteCalculation(${calculationId}, '${coin}')">Удалить</button>
        `;
        historyList.prepend(listItem);

        spreadHistory[coin].push({
          id: calculationId,
          spread: spread.toFixed(2),
          date: new Date().toISOString(),
        });

        saveHistory();
        saveSpreadHistory();
      }

      function deleteCalculation(id, coin) {
        const historyList = document.getElementById("historyList");
        const itemToRemove = historyList.querySelector(`li[data-id="${id}"]`);
        if (itemToRemove) {
          itemToRemove.remove();
        }

        spreadHistory[coin] = spreadHistory[coin].filter(
          (item) => item.id !== id
        );

        saveHistory();
        saveSpreadHistory();
      }

      function clearHistory() {
        document.getElementById("historyList").innerHTML = "";
        localStorage.removeItem("spreadHistory");
        saveHistory();
      }

      function saveHistory() {
        const historyList = document.getElementById("historyList").innerHTML;
        localStorage.setItem("spreadHistory", historyList);
      }

      function loadHistory() {
        const historyList = localStorage.getItem("spreadHistory");
        if (historyList) {
          document.getElementById("historyList").innerHTML = historyList;
        }
      }

      function saveSpreadHistory() {
        localStorage.setItem("spreadData", JSON.stringify(spreadHistory));
      }

      function loadSpreadHistory() {
        const savedData = localStorage.getItem("spreadData");
        if (savedData) {
          spreadHistory = JSON.parse(savedData);
          Object.keys(spreadHistory).forEach((coin) => {
            spreadHistory[coin] = spreadHistory[coin].map((item) => ({
              ...item,
              date: new Date(item.date),
            }));
          });
        }
      }

      function toggleSideMenu() {
        const sideMenu = document.getElementById("sideMenu");
        sideMenu.classList.toggle("open");
      }

      window.onload = function () {
        init(); // Инициализация данных о переводах
        loadHistory();
        loadSpreadHistory();
        fetchUSDTPrice();
        connectWebSocket("TONUSDT");

        const sideMenu = document.getElementById("sideMenu");
        sideMenu.classList.remove("open");
      };
    </script>
  </body>
</html>
